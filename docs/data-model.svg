<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 539" width="1000" height="539" role="img" aria-label="The Power BI model. Semantic layer: invoices (43,807 rows, one per invoice, purchase or return, key invoice) joins two dimensions, many to one: customers (5,832 rows, one per customer, key customer_id) on customer_id and Date (1,095 days, built in DAX) on invoice_date. The customers dimension carries the Gold layer's three scores and the segment as plain columns. Both relationships filter one way, from the dimension to invoices. Analytical layer: the _Measures table holds the 14 measures in 3 display folders.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #0E1630; }
    .sub { font-size: 13.5px; fill: #475569; }
    .layer { font-size: 13px; font-weight: 700; }
    .where { font-size: 11.5px; fill: #506078; }
    .name { font-size: 13px; fill: #0E1630; }
    .count { font-size: 11.5px; fill: #506078; }
    .col { font-size: 12.5px; fill: #0E1630; }
    .key { font-size: 11px; font-weight: 700; }
    .step { font-size: 15px; font-weight: 700; fill: #0E1630; }
    .num { font-size: 12px; font-weight: 700; }
    .desc { font-size: 12.5px; fill: #475569; }
    .edge { fill: none; stroke: #64748B; stroke-width: 1.4; }
  </style>
  <rect x="1" y="1" width="998" height="537" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="40" y="52" class="title">The Power BI model</text>
  <text x="40" y="76" class="sub">Semantic layer: one fact row per invoice, two dimensions, each join many to one. Analytical layer: the measures.</text>
  <path d="M370 208.5 C325.0 208.5 325.0 185.5 280 185.5" class="edge"/>
  <text x="360" y="203.5" class="key" fill="#475569" text-anchor="end">*</text><text x="288" y="180.5" class="key" fill="#475569" text-anchor="start">1</text>
  <path d="M630 231.5 C675.0 231.5 675.0 185.5 720 185.5" class="edge"/>
  <text x="640" y="226.5" class="key" fill="#475569" text-anchor="start">*</text><text x="712" y="180.5" class="key" fill="#475569" text-anchor="end">1</text>
  <rect x="370" y="128" width="260" height="192" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <path d="M370 138 a10 10 0 0 1 10 -10 h240 a10 10 0 0 1 10 10 v36 h-260 Z" fill="#2563EB"/>
  <text x="382" y="148" class="name" font-weight="700" style="fill:#FFFFFF">invoices</text><text x="382" y="165" class="count" style="fill:#FFFFFF">43,807 rows, Semantic layer</text>
  <text x="382" y="190" class="col">invoice</text><text x="618" y="190" class="key" fill="#B45309" text-anchor="end">PK</text>
  <text x="382" y="213" class="col">customer_id</text><text x="618" y="213" class="key" fill="#1D4ED8" text-anchor="end">FK</text>
  <text x="382" y="236" class="col">invoice_date</text><text x="618" y="236" class="key" fill="#1D4ED8" text-anchor="end">FK</text>
  <text x="382" y="259" class="col">invoice_type</text>
  <text x="382" y="282" class="col">amount</text>
  <text x="382" y="305" class="col">month_offset</text>
  <rect x="40" y="128" width="240" height="353" rx="10" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.5"/>
  <path d="M40 138 a10 10 0 0 1 10 -10 h220 a10 10 0 0 1 10 10 v36 h-240 Z" fill="#14B8A6"/>
  <text x="52" y="148" class="name" font-weight="700" style="fill:#0B1220">customers</text><text x="52" y="165" class="count" style="fill:#0B1220">5,832 rows, Semantic layer</text>
  <text x="52" y="190" class="col">customer_id</text><text x="268" y="190" class="key" fill="#B45309" text-anchor="end">PK</text>
  <text x="52" y="213" class="col">country</text>
  <text x="52" y="236" class="col">first_purchase</text>
  <text x="52" y="259" class="col">last_purchase</text>
  <text x="52" y="282" class="col">cohort_month</text>
  <text x="52" y="305" class="col">recency_days</text>
  <text x="52" y="328" class="col">orders</text>
  <text x="52" y="351" class="col">spend</text>
  <text x="52" y="374" class="col">r_score</text><text x="268" y="374" class="key" fill="#B45309" text-anchor="end">Gold layer</text>
  <text x="52" y="397" class="col">f_score</text><text x="268" y="397" class="key" fill="#B45309" text-anchor="end">Gold layer</text>
  <text x="52" y="420" class="col">m_score</text><text x="268" y="420" class="key" fill="#B45309" text-anchor="end">Gold layer</text>
  <text x="52" y="443" class="col">segment</text><text x="268" y="443" class="key" fill="#B45309" text-anchor="end">Gold layer</text>
  <text x="52" y="466" class="col">segment_order</text><text x="268" y="466" class="key" fill="#B45309" text-anchor="end">Gold layer</text>
  <rect x="720" y="128" width="240" height="146" rx="10" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.5"/>
  <path d="M720 138 a10 10 0 0 1 10 -10 h220 a10 10 0 0 1 10 10 v36 h-240 Z" fill="#14B8A6"/>
  <text x="732" y="148" class="name" font-weight="700" style="fill:#0B1220">Date</text><text x="732" y="165" class="count" style="fill:#0B1220">1,095 days, DAX, Semantic layer</text>
  <text x="732" y="190" class="col">Date</text><text x="948" y="190" class="key" fill="#B45309" text-anchor="end">PK</text>
  <text x="732" y="213" class="col">Year</text>
  <text x="732" y="236" class="col">Month Start</text>
  <text x="732" y="259" class="col">Month</text>
  <rect x="720" y="318" width="240" height="123" rx="10" fill="#FFFFFF" stroke="#A855F7" stroke-width="1.5"/>
  <path d="M720 328 a10 10 0 0 1 10 -10 h220 a10 10 0 0 1 10 10 v36 h-240 Z" fill="#A855F7"/>
  <text x="732" y="338" class="name" font-weight="700" style="fill:#FFFFFF">_Measures</text><text x="732" y="355" class="count" style="fill:#FFFFFF">14 measures, Analytical layer</text>
  <text x="732" y="380" class="col">Customers</text><text x="948" y="380" class="key" fill="#7E22CE" text-anchor="end">display folder</text>
  <text x="732" y="403" class="col">Revenue</text><text x="948" y="403" class="key" fill="#7E22CE" text-anchor="end">display folder</text>
  <text x="732" y="426" class="col">Cohorts</text><text x="948" y="426" class="key" fill="#7E22CE" text-anchor="end">display folder</text>
  <text x="40" y="515" class="where">PK primary key · FK foreign key · 1 to * one dimension row to many invoices · "Gold layer": a score or group computed in the Gold layer, carried into the dimension</text>
</svg>
