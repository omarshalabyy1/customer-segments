<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 533" width="1000" height="533" role="img" aria-label="Power BI model: invoices (43,807 rows, one per invoice, purchase or return, key invoice) joins two dimensions, many to one: customers (5,832 rows, one per customer, key customer_id) on customer_id and Date (761 days, built in DAX) on invoice_date to Date. Both filter in one direction, from the dimension to invoices. A separate _Measures table holds the 14 measures.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 13.5px; fill: #CBD5E1; }
    .layer { font-size: 14px; font-weight: 700; fill: #0B1220; }
    .where { font-size: 12px; fill: #94A3B8; }
    .name { font-size: 13px; fill: #F1F5F9; }
    .count { font-size: 11.5px; fill: #94A3B8; }
    .note { font-size: 12px; fill: #CBD5E1; }
    .col { font-size: 12.5px; fill: #E2E8F0; }
    .key { font-size: 11px; font-weight: 700; }
    .edge { fill: none; stroke: #64748B; stroke-width: 1.4; }
  </style>
  <rect width="1000" height="533" rx="22" fill="url(#bg)"/>
  <text x="40" y="50" class="title">The Power BI model</text>
  <text x="40" y="74" class="sub">One fact row per invoice, two dimensions. Each join is many to one, filtering from the dimension to invoices.</text>
  <path d="M370 190.5 C325.0 190.5 325.0 167.5 280 167.5" class="edge" stroke="#94A3B8"/>
  <text x="360" y="185.5" class="key" fill="#CBD5E1" text-anchor="end">*</text><text x="288" y="162.5" class="key" fill="#CBD5E1" text-anchor="start">1</text>
  <path d="M630 213.5 C675.0 213.5 675.0 167.5 720 167.5" class="edge" stroke="#94A3B8"/>
  <text x="640" y="208.5" class="key" fill="#CBD5E1" text-anchor="start">*</text><text x="712" y="162.5" class="key" fill="#CBD5E1" text-anchor="end">1</text>
  <rect x="370" y="110" width="260" height="192" rx="10" fill="#13233D" stroke="#2563EB" stroke-width="1.5"/>
  <path d="M370 120 a10 10 0 0 1 10 -10 h240 a10 10 0 0 1 10 10 v36 h-260 Z" fill="#2563EB"/>
  <text x="382" y="130" class="name" font-weight="700" style="fill:#FFFFFF">invoices</text><text x="382" y="147" class="count" style="fill:#FFFFFF">43,807 rows</text>
  <text x="382" y="172" class="col">invoice</text><text x="618" y="172" class="key" fill="#FBBF24" text-anchor="end">PK</text>
  <text x="382" y="195" class="col">customer_id</text><text x="618" y="195" class="key" fill="#93C5FD" text-anchor="end">FK</text>
  <text x="382" y="218" class="col">invoice_date</text><text x="618" y="218" class="key" fill="#93C5FD" text-anchor="end">FK</text>
  <text x="382" y="241" class="col">invoice_type</text>
  <text x="382" y="264" class="col">amount</text>
  <text x="382" y="287" class="col">month_offset</text>
  <rect x="40" y="110" width="240" height="353" rx="10" fill="#13233D" stroke="#14B8A6" stroke-width="1.5"/>
  <path d="M40 120 a10 10 0 0 1 10 -10 h220 a10 10 0 0 1 10 10 v36 h-240 Z" fill="#14B8A6"/>
  <text x="52" y="130" class="name" font-weight="700" style="fill:#0B1220">customers</text><text x="52" y="147" class="count" style="fill:#0B1220">5,832 rows</text>
  <text x="52" y="172" class="col">customer_id</text><text x="268" y="172" class="key" fill="#FBBF24" text-anchor="end">PK</text>
  <text x="52" y="195" class="col">country</text>
  <text x="52" y="218" class="col">first_purchase</text>
  <text x="52" y="241" class="col">last_purchase</text>
  <text x="52" y="264" class="col">cohort_month</text>
  <text x="52" y="287" class="col">recency_days</text>
  <text x="52" y="310" class="col">orders</text>
  <text x="52" y="333" class="col">spend</text>
  <text x="52" y="356" class="col">r_score</text>
  <text x="52" y="379" class="col">f_score</text>
  <text x="52" y="402" class="col">m_score</text>
  <text x="52" y="425" class="col">segment</text>
  <text x="52" y="448" class="col">segment_order</text>
  <rect x="720" y="110" width="240" height="146" rx="10" fill="#13233D" stroke="#14B8A6" stroke-width="1.5"/>
  <path d="M720 120 a10 10 0 0 1 10 -10 h220 a10 10 0 0 1 10 10 v36 h-240 Z" fill="#14B8A6"/>
  <text x="732" y="130" class="name" font-weight="700" style="fill:#0B1220">Date</text><text x="732" y="147" class="count" style="fill:#0B1220">761 days, DAX table</text>
  <text x="732" y="172" class="col">Date</text><text x="948" y="172" class="key" fill="#FBBF24" text-anchor="end">PK</text>
  <text x="732" y="195" class="col">Year</text>
  <text x="732" y="218" class="col">Month Start</text>
  <text x="732" y="241" class="col">Month</text>
  <rect x="720" y="300" width="240" height="123" rx="10" fill="#13233D" stroke="#94A3B8" stroke-width="1.5"/>
  <path d="M720 310 a10 10 0 0 1 10 -10 h220 a10 10 0 0 1 10 10 v36 h-240 Z" fill="#94A3B8"/>
  <text x="732" y="320" class="name" font-weight="700" style="fill:#0B1220">_Measures</text><text x="732" y="337" class="count" style="fill:#0B1220">14 measures, in 3 display folders</text>
  <text x="732" y="362" class="col">Customers</text>
  <text x="732" y="385" class="col">Revenue</text>
  <text x="732" y="408" class="col">Cohorts</text>
  <text x="40" y="509" class="where">PK primary key · FK foreign key · 1 to * one dimension row to many invoices · cross-filter single, dimension to fact</text>
</svg>
