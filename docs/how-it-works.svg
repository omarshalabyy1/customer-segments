<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="How it works: 01 Clean, duplicates, unknown customers and fees out, returns taken off spend; 02 Score, recency, frequency and spend, each scored 1 to 4; 03 Group, champions, loyal, new, at risk and lost; 04 Cohorts, how many of each month's new customers come back; 05 Report, a Power BI page per group with who to call first.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 13.5px; fill: #CBD5E1; }
    .num { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
    .step { font-size: 16px; font-weight: 700; fill: #FFFFFF; }
    .desc { font-size: 13px; fill: #94A3B8; }
    .link { fill: none; stroke: #64748B; stroke-width: 2; stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
  </style>

  <rect width="1000" height="290" rx="22" fill="url(#bg)"/>
  <text x="40" y="52" class="title">How it works</text>
  <text x="40" y="76" class="sub">One Python notebook does steps 1 to 4 and checks the numbers in SQL. Power BI shows them.</text>

  <path class="link" d="M208 175h20"/>
  <path class="link" d="M396 175h20"/>
  <path class="link" d="M584 175h20"/>
  <path class="link" d="M772 175h20"/>

  <!-- 01 Clean -->
  <rect x="40" y="105" width="168" height="140" rx="14" fill="#3B82F6" fill-opacity="0.08" stroke="#3B82F6" stroke-opacity="0.7"/>
  <circle cx="70" cy="138" r="16" fill="#3B82F6" fill-opacity="0.35"/>
  <text x="70" y="143" class="num" text-anchor="middle">01</text>
  <text x="96" y="144" class="step">Clean</text>
  <text x="56" y="180" class="desc">Duplicates, unknown</text>
  <text x="56" y="199" class="desc">customers and fees out;</text>
  <text x="56" y="218" class="desc">returns off the spend</text>

  <!-- 02 Score -->
  <rect x="228" y="105" width="168" height="140" rx="14" fill="#3B82F6" fill-opacity="0.08" stroke="#3B82F6" stroke-opacity="0.7"/>
  <circle cx="258" cy="138" r="16" fill="#3B82F6" fill-opacity="0.35"/>
  <text x="258" y="143" class="num" text-anchor="middle">02</text>
  <text x="284" y="144" class="step">Score</text>
  <text x="244" y="180" class="desc">Recency, frequency</text>
  <text x="244" y="199" class="desc">and spend, each</text>
  <text x="244" y="218" class="desc">scored 1 to 4</text>

  <!-- 03 Group -->
  <rect x="416" y="105" width="168" height="140" rx="14" fill="#3B82F6" fill-opacity="0.08" stroke="#3B82F6" stroke-opacity="0.7"/>
  <circle cx="446" cy="138" r="16" fill="#3B82F6" fill-opacity="0.35"/>
  <text x="446" y="143" class="num" text-anchor="middle">03</text>
  <text x="472" y="144" class="step">Group</text>
  <text x="432" y="180" class="desc">Champions, loyal,</text>
  <text x="432" y="199" class="desc">new, at risk</text>
  <text x="432" y="218" class="desc">and lost</text>

  <!-- 04 Cohorts -->
  <rect x="604" y="105" width="168" height="140" rx="14" fill="#3B82F6" fill-opacity="0.08" stroke="#3B82F6" stroke-opacity="0.7"/>
  <circle cx="634" cy="138" r="16" fill="#3B82F6" fill-opacity="0.35"/>
  <text x="634" y="143" class="num" text-anchor="middle">04</text>
  <text x="660" y="144" class="step">Cohorts</text>
  <text x="620" y="180" class="desc">How many of each</text>
  <text x="620" y="199" class="desc">month's new customers</text>
  <text x="620" y="218" class="desc">come back</text>

  <!-- 05 Report -->
  <rect x="792" y="105" width="168" height="140" rx="14" fill="#F59E0B" fill-opacity="0.08" stroke="#F59E0B" stroke-opacity="0.8"/>
  <circle cx="822" cy="138" r="16" fill="#F59E0B" fill-opacity="0.35"/>
  <text x="822" y="143" class="num" text-anchor="middle">05</text>
  <text x="848" y="144" class="step">Report</text>
  <text x="808" y="180" class="desc">A Power BI page per</text>
  <text x="808" y="199" class="desc">group, with who to</text>
  <text x="808" y="218" class="desc">call first</text>
</svg>
