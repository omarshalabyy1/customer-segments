<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="How it works, in six layers: 01 Bronze layer, the invoice file as received, every line of both yearly sheets; 02 Silver layer, duplicates, unknown customers and fees out, one row per invoice; 03 Gold layer, recency, frequency and spend each scored 1 to 4, five groups and the at-risk call list; 04 Semantic layer, invoices.csv and customers.csv, the two tables Power BI loads; 05 Analytical layer, cohorts and 14 DAX measures; 06 Reporting layer, a Power BI page per group with who to call first.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #0E1630; }
    .sub { font-size: 13.5px; fill: #475569; }
    .layer { font-size: 13px; font-weight: 700; }
    .where { font-size: 11.5px; fill: #506078; }
    .name { font-size: 13px; fill: #0E1630; }
    .count { font-size: 11.5px; fill: #506078; }
    .col { font-size: 12.5px; fill: #0E1630; }
    .key { font-size: 11px; font-weight: 700; }
    .step { font-size: 15px; font-weight: 700; fill: #0E1630; }
    .num { font-size: 12px; font-weight: 700; }
    .desc { font-size: 12.5px; fill: #475569; }
    .edge { fill: none; stroke: #64748B; stroke-width: 1.4; }
  </style>
  <rect x="1" y="1" width="998" height="278" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="40" y="52" class="title">How it works</text>
  <text x="40" y="76" class="sub">The Python notebook builds layers 1 to 4 and the cohort table, and checks the numbers in SQL. Power BI adds the measures and pages.</text>
  <rect x="30" y="100" width="148" height="150" rx="14" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.6"/>
  <path d="M30 114 a14 14 0 0 1 14 -14 h120 a14 14 0 0 1 14 14 v24 h-148 Z" fill="#3B82F6"/>
  <text x="42" y="124" class="num" style="fill:#0B1220">01</text><text x="66" y="124" class="layer" style="fill:#0B1220">Bronze layer</text>
  <text x="42" y="162" class="desc">The invoice file as</text>
  <text x="42" y="181" class="desc">received: every line,</text>
  <text x="42" y="200" class="desc">both yearly sheets</text>
  <rect x="186" y="100" width="148" height="150" rx="14" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.6"/>
  <path d="M186 114 a14 14 0 0 1 14 -14 h120 a14 14 0 0 1 14 14 v24 h-148 Z" fill="#0EA5E9"/>
  <text x="198" y="124" class="num" style="fill:#0B1220">02</text><text x="222" y="124" class="layer" style="fill:#0B1220">Silver layer</text>
  <text x="198" y="162" class="desc">Duplicates, unknown</text>
  <text x="198" y="181" class="desc">customers and fees</text>
  <text x="198" y="200" class="desc">out; one row per</text>
  <text x="198" y="219" class="desc">invoice</text>
  <path d="M178 195 H186" class="edge" marker-end="url(#arrow)"/>
  <rect x="342" y="100" width="148" height="150" rx="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.6"/>
  <path d="M342 114 a14 14 0 0 1 14 -14 h120 a14 14 0 0 1 14 14 v24 h-148 Z" fill="#F59E0B"/>
  <text x="354" y="124" class="num" style="fill:#0B1220">03</text><text x="378" y="124" class="layer" style="fill:#0B1220">Gold layer</text>
  <text x="354" y="162" class="desc">Recency, frequency</text>
  <text x="354" y="181" class="desc">and spend scored</text>
  <text x="354" y="200" class="desc">1 to 4; five groups;</text>
  <text x="354" y="219" class="desc">the at-risk list</text>
  <path d="M334 195 H342" class="edge" marker-end="url(#arrow)"/>
  <rect x="498" y="100" width="148" height="150" rx="14" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.6"/>
  <path d="M498 114 a14 14 0 0 1 14 -14 h120 a14 14 0 0 1 14 14 v24 h-148 Z" fill="#14B8A6"/>
  <text x="510" y="124" class="num" style="fill:#0B1220">04</text><text x="534" y="124" class="layer" style="fill:#0B1220">Semantic layer</text>
  <text x="510" y="162" class="desc">invoices.csv and</text>
  <text x="510" y="181" class="desc">customers.csv, the</text>
  <text x="510" y="200" class="desc">two tables Power BI</text>
  <text x="510" y="219" class="desc">loads</text>
  <path d="M490 195 H498" class="edge" marker-end="url(#arrow)"/>
  <rect x="654" y="100" width="148" height="150" rx="14" fill="#FFFFFF" stroke="#A855F7" stroke-width="1.6"/>
  <path d="M654 114 a14 14 0 0 1 14 -14 h120 a14 14 0 0 1 14 14 v24 h-148 Z" fill="#A855F7"/>
  <text x="666" y="124" class="num" style="fill:#FFFFFF">05</text><text x="690" y="124" class="layer" style="fill:#FFFFFF">Analytical layer</text>
  <text x="666" y="162" class="desc">Cohorts: who comes</text>
  <text x="666" y="181" class="desc">back; 14 DAX</text>
  <text x="666" y="200" class="desc">measures</text>
  <path d="M646 195 H654" class="edge" marker-end="url(#arrow)"/>
  <rect x="810" y="100" width="148" height="150" rx="14" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.6"/>
  <path d="M810 114 a14 14 0 0 1 14 -14 h120 a14 14 0 0 1 14 14 v24 h-148 Z" fill="#22C55E"/>
  <text x="822" y="124" class="num" style="fill:#0B1220">06</text><text x="846" y="124" class="layer" style="fill:#0B1220">Reporting layer</text>
  <text x="822" y="162" class="desc">A Power BI page per</text>
  <text x="822" y="181" class="desc">group, with who to</text>
  <text x="822" y="200" class="desc">call first</text>
  <path d="M802 195 H810" class="edge" marker-end="url(#arrow)"/>
</svg>
