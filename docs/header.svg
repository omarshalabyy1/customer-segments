<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="customer-segments: who brings the revenue, and who is slipping away. 30% of customers bring 77% of revenue, and 631 good customers have stopped buying. Two bars compare each group's share of customers with its share of revenue.">
  <defs>
    <clipPath id="bars"><rect x="150" y="150" width="810" height="28" rx="7"/><rect x="150" y="198" width="810" height="28" rx="7"/></clipPath>
      <radialGradient id="jrGlowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jrGlowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .name { font-size: 32px; font-weight: 700; fill: #0E1630; }
    .sub { font-size: 16px; fill: #475569; }
    .result { font-size: 15px; fill: #0E1630; }
    .hot { fill: #C2410C; font-weight: 700; }
    .lab { font-size: 14px; font-weight: 700; fill: #0E1630; }
    .in { font-size: 13px; font-weight: 700; }
    .leg { font-size: 12.5px; fill: #475569; }
      .wave { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 2 10; animation: flow 6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -120; } }
  </style>

  <rect x="1" y="1" width="998" height="278" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="880" cy="60" r="190" fill="url(#jrGlowA)"/>
  <circle cx="160" cy="260" r="170" fill="url(#jrGlowB)"/>
  <path class="wave" stroke="#14B8A6" stroke-opacity="0.5" d="M24 269 C 200 264, 330 273, 500 269 S 800 265, 976 269"/>
  <path class="wave" stroke="#8B5CF6" stroke-opacity="0.4" style="animation-duration:9s" d="M40 275 C 220 271, 360 278, 520 275 S 820 272, 960 275"/>

  <text x="40" y="64" class="name">customer-segments</text>
  <text x="40" y="94" class="sub">Who brings the revenue, and who is slipping away</text>
  <text x="40" y="126" class="result"><tspan font-weight="700">30% of customers bring 77% of revenue.</tspan> <tspan class="hot">631 good customers</tspan> have stopped buying.</text>

  <text x="40" y="169" class="lab">Customers</text>
  <text x="40" y="217" class="lab">Revenue</text>
  <g clip-path="url(#bars)">
  <rect x="150.0" y="150" width="246.1" height="28" fill="#2563EB"/>
  <text x="273.1" y="169" class="in" fill="#FFFFFF" text-anchor="middle">30%</text>
  <rect x="396.1" y="150" width="108.2" height="28" fill="#8DB0FF"/>
  <text x="450.2" y="169" class="in" fill="#0B1220" text-anchor="middle">13%</text>
  <rect x="504.3" y="150" width="50.6" height="28" fill="#C7D7FE"/>
  <text x="529.6" y="169" class="in" fill="#0B1220" text-anchor="middle">6%</text>
  <rect x="554.9" y="150" width="87.6" height="28" fill="#C2410C"/>
  <text x="598.7" y="169" class="in" fill="#FFFFFF" text-anchor="middle">11%</text>
  <rect x="642.5" y="150" width="317.5" height="28" fill="#4A5675"/>
  <text x="801.3" y="169" class="in" fill="#FFFFFF" text-anchor="middle">39%</text>
  <rect x="150.0" y="198" width="624.7" height="28" fill="#2563EB"/>
  <text x="462.4" y="217" class="in" fill="#FFFFFF" text-anchor="middle">77%</text>
  <rect x="774.7" y="198" width="27.3" height="28" fill="#8DB0FF"/>
  <rect x="802.1" y="198" width="6.8" height="28" fill="#C7D7FE"/>
  <rect x="808.8" y="198" width="97.9" height="28" fill="#C2410C"/>
  <text x="857.8" y="217" class="in" fill="#FFFFFF" text-anchor="middle">12%</text>
  <rect x="906.7" y="198" width="53.3" height="28" fill="#4A5675"/>
  <text x="933.4" y="217" class="in" fill="#FFFFFF" text-anchor="middle">7%</text>
  </g>
  <rect x="150" y="242" width="12" height="12" rx="3" fill="#2563EB"/>
  <text x="168" y="253" class="leg">Champions</text>
  <rect x="272" y="242" width="12" height="12" rx="3" fill="#8DB0FF"/>
  <text x="290" y="253" class="leg">Loyal</text>
  <rect x="362" y="242" width="12" height="12" rx="3" fill="#C7D7FE"/>
  <text x="380" y="253" class="leg">New</text>
  <rect x="436" y="242" width="12" height="12" rx="3" fill="#C2410C"/>
  <text x="454" y="253" class="leg">At risk</text>
  <rect x="542" y="242" width="12" height="12" rx="3" fill="#4A5675"/>
  <text x="560" y="253" class="leg">Lost</text>
</svg>
