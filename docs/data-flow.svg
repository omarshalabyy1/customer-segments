<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 528" width="1000" height="528" role="img" aria-label="Data flow, table by table: config.py reads the sales Excel file, two yearly sheets, 1,067,371 invoice lines. The notebook cleans them to 794,163 lines (duplicates, lines with no customer ID, non-products and zero prices out), groups them into invoices and scores customers, and writes data/invoices.csv (43,807 rows) and data/customers.csv (5,832 rows), plus four charts in docs. DuckDB re-checks the key numbers in SQL. Power BI loads the two files into seven pages.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 13.5px; fill: #CBD5E1; }
    .layer { font-size: 14px; font-weight: 700; fill: #0B1220; }
    .where { font-size: 12px; fill: #94A3B8; }
    .name { font-size: 13px; fill: #F1F5F9; }
    .count { font-size: 11.5px; fill: #94A3B8; }
    .note { font-size: 12px; fill: #CBD5E1; }
    .col { font-size: 12.5px; fill: #E2E8F0; }
    .key { font-size: 11px; font-weight: 700; }
    .edge { fill: none; stroke: #64748B; stroke-width: 1.4; }
  </style>
  <rect width="1000" height="528" rx="22" fill="url(#bg)"/>
  <text x="40" y="50" class="title">Data flow, table by table</text>
  <text x="40" y="74" class="sub">From the client's invoice file to the two tables Power BI loads. config.py reads the file, the notebook does the rest.</text>
  <rect x="30" y="96" width="160" height="26" rx="13" fill="#94A3B8"/><text x="110.0" y="114" class="layer" text-anchor="middle">Input file</text>
  <text x="110.0" y="138" class="where" text-anchor="middle">data/input, read by config.py</text>
  <rect x="212" y="96" width="150" height="26" rx="13" fill="#0EA5E9"/><text x="287.0" y="114" class="layer" text-anchor="middle">1  Clean</text>
  <text x="287.0" y="138" class="where" text-anchor="middle">notebook, section 2</text>
  <rect x="384" y="96" width="132" height="26" rx="13" fill="#14B8A6"/><text x="450.0" y="114" class="layer" text-anchor="middle">2  Score and group</text>
  <text x="450.0" y="138" class="where" text-anchor="middle">notebook, sections 3 to 7</text>
  <rect x="546" y="96" width="150" height="26" rx="13" fill="#94A3B8"/><text x="621.0" y="114" class="layer" text-anchor="middle">Output files</text>
  <text x="621.0" y="138" class="where" text-anchor="middle">written in section 8</text>
  <rect x="720" y="96" width="250" height="26" rx="13" fill="#22C55E"/><text x="845.0" y="114" class="layer" text-anchor="middle">3  Power BI</text>
  <text x="845.0" y="138" class="where" text-anchor="middle">import mode, 7 pages</text>
  <rect x="30" y="150" width="160" height="124" rx="10" fill="#13233D" stroke="#94A3B8" stroke-opacity="0.7"/>
  <text x="42" y="180" class="name" font-weight="700">Sales Excel file</text>
  <text x="42" y="206" class="note">sheet Year 2009-2010</text>
  <text x="42" y="232" class="note">sheet Year 2010-2011</text>
  <text x="42" y="258" class="count">1,067,371 invoice lines</text>
  <rect x="212" y="196" width="150" height="32" rx="7" fill="#13233D" stroke="#0EA5E9" stroke-opacity="0.7"/><text x="222" y="217" class="name">lines</text><text x="354" y="217" class="count" text-anchor="end">794,163</text>
  <path d="M190 212.0 H211" class="edge" marker-end="url(#arrow)"/>
  <text x="216" y="256" class="count">-34,335 duplicates</text>
  <text x="216" y="274" class="count">-235,151 no customer ID</text>
  <text x="216" y="292" class="count">-3,662 not a product</text>
  <text x="216" y="310" class="count">-60 zero price or no quantity</text>
  <rect x="384" y="150" width="132" height="32" rx="7" fill="#13233D" stroke="#14B8A6" stroke-opacity="0.7"/><text x="394" y="171" class="name">invoices</text>
  <rect x="384" y="242" width="132" height="32" rx="7" fill="#13233D" stroke="#14B8A6" stroke-opacity="0.7"/><text x="394" y="263" class="name">customers</text>
  <rect x="384" y="334" width="132" height="32" rx="7" fill="#13233D" stroke="#14B8A6" stroke-opacity="0.7"/><text x="394" y="355" class="name">retention</text>
  <rect x="384" y="426" width="132" height="32" rx="7" fill="#13233D" stroke="#14B8A6" stroke-opacity="0.7" stroke-dasharray="4 4"/><text x="394" y="447" class="name">SQL check, DuckDB</text>
  <text x="450" y="418" class="count" text-anchor="middle">reads invoices, customers</text>
  <path d="M362 212.0 H368 V166.0 H383" class="edge" marker-end="url(#arrow)"/>
  <line x1="430" y1="182" x2="430" y2="240" class="edge" marker-end="url(#arrow)"/>
  <line x1="470" y1="242" x2="470" y2="184" class="edge" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <line x1="450" y1="274" x2="450" y2="332" class="edge" marker-end="url(#arrow)"/>
  <rect x="546" y="150" width="150" height="32" rx="7" fill="#13233D" stroke="#94A3B8" stroke-opacity="0.7"/><text x="556" y="171" class="name">invoices.csv</text><text x="688" y="171" class="count" text-anchor="end">43,807</text>
  <rect x="546" y="242" width="150" height="32" rx="7" fill="#13233D" stroke="#94A3B8" stroke-opacity="0.7"/><text x="556" y="263" class="name">customers.csv</text><text x="688" y="263" class="count" text-anchor="end">5,832</text>
  <rect x="546" y="315.6" width="150" height="142.39999999999998" rx="10" fill="#13233D" stroke="#94A3B8" stroke-opacity="0.7"/>
  <text x="558" y="341.6" class="name" font-weight="700">docs/, 4 charts</text>
  <text x="558" y="363.6" class="note">data-health.png</text>
  <text x="558" y="385.6" class="note">segments.png</text>
  <text x="558" y="407.6" class="note">at-risk.png</text>
  <text x="558" y="429.6" class="note">cohorts.png</text>
  <path d="M516 166.0 H545" class="edge" marker-end="url(#arrow)"/>
  <path d="M516 258.0 H545" class="edge" marker-end="url(#arrow)"/>
  <path d="M516 266.0 H524 V335.6 H545" class="edge" marker-end="url(#arrow)"/>
  <path d="M516 350.0 H530 V379.6 H545" class="edge" marker-end="url(#arrow)"/>
  <path d="M287 324 V474 H620 V460" class="edge" marker-end="url(#arrow)"/>
  <path d="M696 166.0 H708 V258.0 H696" class="edge" stroke="#94A3B8"/>
  <line x1="708" y1="212.0" x2="724" y2="212.0" class="edge" stroke="#22C55E" marker-end="url(#arrow)"/>
  <rect x="726" y="150" width="244" height="308" rx="12" fill="#13233D" stroke="#22C55E" stroke-opacity="0.7"/>
  <text x="848" y="172" class="count" text-anchor="middle">+ Date table, built in DAX</text>
  <rect x="740" y="186" width="216" height="30" rx="15" fill="#166534"/><text x="848" y="206" class="name" text-anchor="middle">Overview</text>
  <rect x="740" y="224" width="216" height="30" rx="15" fill="#166534"/><text x="848" y="244" class="name" text-anchor="middle">Champions</text>
  <rect x="740" y="262" width="216" height="30" rx="15" fill="#166534"/><text x="848" y="282" class="name" text-anchor="middle">Loyal</text>
  <rect x="740" y="300" width="216" height="30" rx="15" fill="#166534"/><text x="848" y="320" class="name" text-anchor="middle">New</text>
  <rect x="740" y="338" width="216" height="30" rx="15" fill="#166534"/><text x="848" y="358" class="name" text-anchor="middle">At risk</text>
  <rect x="740" y="376" width="216" height="30" rx="15" fill="#166534"/><text x="848" y="396" class="name" text-anchor="middle">Lost</text>
  <rect x="740" y="414" width="216" height="30" rx="15" fill="#166534"/><text x="848" y="434" class="name" text-anchor="middle">Return by starting month</text>
  <text x="40" y="504" class="where">dashed: customers sets month_offset on invoices and keeps only scored customers; DuckDB recomputes the key numbers in SQL and the notebook stops on any difference</text>
</svg>
